# Vite static build. Connect Git and Netlify will run the build automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA-style fallback (single page) just in case of deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
