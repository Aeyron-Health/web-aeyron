# Vite static build. Connect Git and Netlify will run the build automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Explicit legal/support pages are emitted as static route entries.
[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support/index.html"
  status = 200

[[redirects]]
  from = "/delete"
  to = "/delete/index.html"
  status = 200

## SPA-style fallback for the product site.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
